name: 'publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only install the target you actually need to save time
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # This is the key for Windows: cache the target folder strictly
          workspaces: "src-tauri -> target"

      - name: install dependencies
        # 'npm ci' is faster and more reliable than 'npm install' in CI/CD
        run: npm ci 

      - name: build frontend
        run: npm run build

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optimization: Tells Rust to use more cores for the heavy lifting
          CARGO_BUILD_JOBS: 4 
        with:
          tagName: v__VERSION__
          releaseName: 'CUS Spy v__VERSION__'
          releaseBody: 'Automatic monitoring update.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}